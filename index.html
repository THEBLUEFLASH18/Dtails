<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@100..900&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dtails</title>
</head>

<body>
  <!-- Set theme before React mounts to prevent flash of wrong theme -->
  <script>
    // ── Theme hours ── Change these two numbers to adjust when light/dark kicks in
    window.__THEME_START__ = 6;   // light mode begins (24h)
    window.__THEME_END__ = 23;  // dark mode begins  (24h)
    var h = new Date().getHours();
    document.documentElement.setAttribute(
      'data-theme',
      h >= window.__THEME_START__ && h < window.__THEME_END__ ? 'light' : 'dark'
    );
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
